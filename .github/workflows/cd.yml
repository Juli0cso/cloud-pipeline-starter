name: CD - deploy EC2
# Deploy roda num runner auto-hospedado instalado na propria EC2:
# nao ha SSH de entrada vindo do GitHub, entao a porta 22 fica fechada
# (acesso administrativo via AWS Systems Manager Session Manager).
on:
  workflow_run:
    workflows: ["CI - tests and image"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # Only successful CI runs started by pushes to main.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, linux, ec2]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy immutable image
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_SHA}"
          bash scripts/deploy.sh "$IMAGE"
      - name: Verify health and deployed version
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail --show-error --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1/health
          curl --fail --silent http://127.0.0.1/version | tee /dev/stderr | grep -q "$DEPLOY_SHA"
